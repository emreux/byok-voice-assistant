# Turkish (design.md 3.12). One of the two locales phase 1 ships complete.
#
# Comments here are English because they are notes to whoever edits the file;
# the values are Turkish because they are what the user reads and hears.
# `_template.toml` explains what each key is for.

code = "tr"
name = "Türkçe"

[stt]
language = "tr"
# Words the recogniser is told to expect before each sentence (design.md 3.4):
# the commands people say most. The app names are added by the program.
vocabulary_hint = "aç, ayarlar, müzik, sonraki, önceki, saat, Bluetooth, Spotify"

[speech]
# What the confirmation window listens for (design.md 3.1 rule 2). Whole
# words, any case; a "no" anywhere in the answer wins over a "yes".
yes_words = ["evet", "onaylıyorum", "tamam", "olur"]
no_words = ["hayır", "iptal", "vazgeç", "olmaz"]

[intents]
# Short commands answered without asking the model (design.md 4): the name
# of the intent, then the phrases that mean it, each matched whole. "saat
# kaçta toplantım var" is not "saat kaçta" and goes to the model.
get_time = ["saat kaç", "saat kaçta"]
stop = ["dur", "sus", "kes"]
cancel = ["iptal", "vazgeç", "boş ver"]

[probe]
# The one question the setup wizard puts to a model to see whether it calls
# a tool (design.md 3.2): it has to be something the model cannot answer
# from memory, so that the only good answer is to call get_current_time.
# In Turkish, so that the same request shows the model understands it.
question = "İstanbul'da saat kaç?"

[tts.voice]
# Tolga is the voice Windows itself ships for Turkish. It lives in the
# Speech_OneCore registry hive, which `tts/sapi.py` reads on purpose.
sapi = "Tolga"

[ui]
welcome = "Asistan, senin API anahtarınla, seçtiğin yapay zekâ sağlayıcısına bağlanır."
provider = "Hangi sağlayıcıyı kullanmak istiyorsun?"
only_provider = "Sağlayıcı: {name} — bu sürümün konuşabildiği tek sağlayıcı."
no_provider = "Bu sürüm, listedeki sağlayıcıların hiçbirini kuramıyor."
locale = "Asistan hangi dili konuşsun?"
key_url = "Anahtarı buradan oluşturabilirsin: {url}"
api_key = "API anahtarını yapıştır (yazarken ekranda görünmez)"
api_key_keep = "API anahtarını yapıştır, ya da kayıtlı olanı korumak için Enter'a bas"
key_needed = "Bu sağlayıcı, cevap vermeden önce bir anahtar istiyor."
checking_key = "Anahtar kontrol ediliyor..."
base_url = "Sunucunun adresi — OpenAI uyumlu taban URL, sonu /v1 ile biter"
checking_server = "Sunucunun cevap verip vermediği kontrol ediliyor..."
bad_key = "Bu anahtar çalışmadı — yanlış yazılmış, iptal edilmiş ya da kredisi bitmiş olabilir."
provider_unreachable = "Sağlayıcıya ulaşılamadı. Bağlantını kontrol edip tekrar dene."
loading_models = "Anahtarın erişebildiği modeller soruluyor..."
no_models = "Anahtar çalışıyor ama hiçbir modele erişemiyor. Sağlayıcının konsolunu kontrol et."
model = "Hangi model cevap versin?"
probing_tools = "Modelin araç çağırıp çağıramadığı sınanıyor..."
tools_ok = "Model araç çağırabiliyor — ilk yanıt {ms} ms'de geldi."
tools_failed = "Bu model araç çağıramıyor; asistanın işlerinin çoğu buna bağlı. Başka bir model seç."
probe_refused = "Model sınanamadı: {problem}. Başka bir model seç ya da tekrar dene."
saved = "Hazır. Ayarlar: {path} — anahtarın kendisi Windows Kimlik Bilgisi Yöneticisi'nde."
cancelled = "Kurulum iptal edildi. Hiçbir şey değiştirilmedi."

# Spoken out loud rather than shown, so they are short (item 1.10).
unreachable = "Sağlayıcıya bağlanamadım, tekrar dener misin?"
key_invalid = "API anahtarın geçersiz görünüyor, yenilemen gerekiyor."
took_too_long = "Bu iş uzadı, tekrar dener misin?"
not_understood = "Seni anlayamadım, tekrar söyler misin?"
confirm_hint = "Evet ya da hayır de."
confirm_again = "Anlayamadım. Evet mi, hayır mı?"
answer_cut_off = "Cevabın sonu kesildi."
daily_over = "Bugünkü harcama sınırını aştın."
monthly_over = "Bu ayki harcama sınırını aştın."
spend_stopped = "Harcama sınırı aşıldı, bu yüzden modele sormuyorum."
# The fast path's answer to "saat kaç" (design.md 4). Two numbers for now;
# the voice reads them, and the number formatter of phase 3 words them.
time_is = "Saat {hour} {minute}."
# Added by the gate to a risky tool's question when the same call ran a
# moment ago (design.md 3.11). {ago} is one of the two spans below.
duplicate_done = "Bunu {ago} önce zaten yaptın."
duplicate_uncertain = "Bunu {ago} önce denedin, sonucu belirsiz kaldı."
seconds_ago = "{count} saniye"
minutes_ago = "{count} dakika"

# Shown on screen while it runs - the status line and what a turn left behind
# (item 1.11). Short: they share one line with the hotkey.
hold_to_talk = "Konuşmak için {hotkey} basılı tut, ya da {toggle} ile dinlemede kal. Ctrl+C durdurur."
hands_free = "Dinliyorum - konuşman yeterli. {toggle} dinlemeyi kapatır, Ctrl+C her şeyi."
loading_speech = "Konuşma modeli yükleniyor..."
checking_model = "Modelin araç çağırıp çağıramadığı sınanıyor..."
state_idle = "hazır"
state_listening = "dinliyor"
state_transcribing = "yazıya döküyor"
state_thinking = "düşünüyor"
state_confirming = "onay bekliyor"
state_speaking = "konuşuyor"
you_said = "sen"
it_said = "asistan"
turn_cost = "{input} girdi, {output} çıktı"
not_caught = "(anlaşılmadı - güven {confidence})"

# Said once, by the command line itself, when it can or cannot start.
not_set_up = "Henüz kurulum yapılmamış. Önce 'assistant setup' çalıştır."
cannot_start = "Asistan başlayamıyor: {problem}"
stopped = "Durduruldu."
model_no_tools = "Model araç çağıramıyor; asistanın işlerinin çoğu buna bağlı. Başka bir model seçmek için 'assistant setup' çalıştır."

# Shown by `assistant cost` (design.md section 6): two small tables, today
# and this month, one row per model. Amounts are written by the code, as
# `$0.0004`.
cost_none = "Henüz kayıtlı harcama yok."
cost_today = "bugün"
cost_month = "bu ay"
cost_model = "model"
cost_turns = "tur"
cost_tokens = "girdi / çıktı / önbellek"
cost_spent = "harcama"
cost_total = "toplam"
cost_unpriced = "{model} için {count} turun fiyatı pricing.toml'da yok; toplama girmedi."
