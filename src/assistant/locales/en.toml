# English (design.md 3.12).
#
# The middle link of the fallback chain: a key another pack leaves out is
# answered here, and a key this pack leaves out is answered by the English
# constant written beside the code that says it.
#
# There is deliberately no [ui] table. Every sentence already exists in English
# next to the code that says it, and a second copy here would be a second thing
# to keep in step - the two would drift, and the drift would be invisible.

code = "en"
name = "English"

[stt]
# What the recogniser is told to expect. Usually `code`, but not always: this
# is the language people *speak* to the assistant, not the one it shows them.
language = "en"

[tts.voice]
# The preferred voice, matched against the names Windows actually lists. It is
# a preference, not an identifier: when it is not installed, any other voice
# for this language is used instead. Zira is one of the voices Windows ships
# for English.
sapi = "Zira"
